productName = "fabric-memory"
version = "0.2.0"
identifier = "local.memoryfabric.mac"

[build]
frontendDist = "../ui"

[app]
withGlobalTauri = true

[[app.windows]]
label = "main"
title = "fabric-memory"
width = 1000
height = 740
minWidth = 760
minHeight = 620
decorations = false
# Let the WebView deliver dropped files to the prompt.
dragDropEnabled = false
transparent = false

[app.security]
csp = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data: blob:; connect-src ipc: http://ipc.localhost"

[bundle]
active = false
