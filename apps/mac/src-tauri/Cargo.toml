[package]
name = "fabric-mac"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
fabric-core = { path = "../../../core" }
tauri = { version = "2.12", default-features = false, features = ["wry", "config-toml"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
scraper = "0.24"
qrcodegen = "1.8"
rcgen = { version = "0.14", features = ["x509-parser"] }
base64 = "0.22"
time = "0.3"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2.7", features = ["config-toml"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
